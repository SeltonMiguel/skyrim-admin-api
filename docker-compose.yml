services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Copy .env.example to .env first}
      POSTGRES_USER: ${DB_USERNAME:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
